<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Content and Brand Systems relational data model</title>
  <desc id="desc">Project is the central record with verified one-to-many relationships to research questions, research sources, revisions, approvals, history events, and export packages.</desc>
  <style>
    .canvas{fill:#FCFCFD}
    .entity{fill:#FFFFFF;stroke:#D8D5E0;stroke-width:2}

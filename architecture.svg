<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Content and Brand Systems public-safe architecture</title>
  <desc id="desc">Five verified layers connect the Next.js interface to a FastAPI boundary, domain services, SQLAlchemy and local SQLite storage, and export files.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6D28D9"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#FCFCFD}
    .layer{fill:#FFFFFF;stroke:#D8D5E0;stroke-width:2}
    .accent{fill:#7C3AED}
    .tech{fill:#F5F3FF;stroke:#C4B5FD;stroke-width:2}
    .connector{fill:none;stroke:#6D28D9;stroke-width:3}
    .title{fill:#262330;font:700 30px Arial,Helvetica,sans-serif}
    .subtitle{fill:#625D6B;font:400 18px Arial,Helvetica,sans-serif}
    .heading{fill:#312E38;font:700 20px Arial,Helvetica,sans-serif}
    .label{fill:#4F4659;font:700 18px Arial,Helvetica,sans-serif;letter-spacing:1px}
    .detail{fill:#262330;font:700 20px Arial,Helvetica,sans-serif}
  </style>
  <rect class="canvas" width="1200" height="710"/>
  <text class="title" x="60" y="54">Public-safe architecture</text>
  <text class="subtitle" x="60" y="84">Content &amp; Brand Systems · compact verified layers</text>

  <rect class="layer" x="140" y="112" width="920" height="82" rx="12"/>
  <rect class="accent" x="140" y="112" width="8" height="82" rx="4"/>
  <text class="label" x="180" y="146">USER EXPERIENCE</text>
  <text class="detail" x="180" y="176">Next.js interface</text>

  <path class="connector" d="M600 194 V224" marker-end="url(#arrow)"/>
  <rect class="layer" x="140" y="230" width="920" height="82" rx="12"/>
  <rect class="accent" x="140" y="230" width="8" height="82" rx="4"/>
  <text class="label" x="180" y="264">APPLICATION AND API</text>
  <text class="detail" x="180" y="294">FastAPI boundary</text>

  <path class="connector" d="M600 312 V342" marker-end="url(#arrow)"/>
  <rect class="layer" x="140" y="348" width="920" height="82" rx="12"/>
  <rect class="accent" x="140" y="348" width="8" height="82" rx="4"/>
  <text class="label" x="180" y="382">WORKFLOW LOGIC</text>
  <text class="detail" x="180" y="412">Domain services</text>

  <path class="connector" d="M600 430 V460" marker-end="url(#arrow)"/>
  <rect class="layer" x="140" y="466" width="920" height="82" rx="12"/>
  <rect class="accent" x="140" y="466" width="8" height="82" rx="4"/>
  <text class="label" x="180" y="500">DATA AND STORAGE</text>
  <rect class="tech" x="500" y="482" width="235" height="50" rx="9"/>
  <text class="detail" x="617.5" y="514" text-anchor="middle">SQLAlchemy models</text>
  <path class="connector" d="M735 507 H769" marker-end="url(#arrow)"/>
  <rect class="tech" x="781" y="482" width="225" height="50" rx="9"/>
  <text class="detail" x="893.5" y="514" text-anchor="middle">Local SQLite</text>

  <path class="connector" d="M600 548 V578" marker-end="url(#arrow)"/>
  <rect class="layer" x="140" y="584" width="920" height="82" rx="12"/>
  <rect class="accent" x="140" y="584" width="8" height="82" rx="4"/>
  <text class="label" x="180" y="618">VERIFIED OUTPUT BOUNDARY</text>
  <text class="detail" x="180" y="648">Export files</text>
</svg>

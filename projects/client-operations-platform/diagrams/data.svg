<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Client Operations relational data model</title>
  <desc id="desc">Thirteen verified relationships across customer and booking records, waivers, payments, and daily check-in records.</desc>
  <style>
    .canvas{fill:#FCFCFD}.panel{fill:#F8F7FA;stroke:#D8D5E0;stroke-width:2}.subpanel{fill:#FFFFFF;stroke:#E3E0E8;stroke-width:2}.entity{fill:#FFFFFF;stroke:#CFC9DA;stroke-width:2}.focus{fill:#F0EAFF;stroke:#7C3AED;stroke-width:2.5}.connector{fill:none;stroke:#6D28D9;stroke-width:2.5}.title{fill:#262330;font:700 30px Arial,Helvetica,sans-serif}.subtitle{fill:#625D6B;font:400 18px Arial,Helvetica,sans-serif}.section{fill:#312E38;font:700 22px Arial,Helvetica,sans-serif}.group{fill:#4F4659;font:700 18px Arial,Helvetica,sans-serif;letter-spacing:1px}.entityName{fill:#262330;font:700 19px Arial,Helvetica,sans-serif}.entityType{fill:#625D6B;font:400 16px Arial,Helvetica,sans-serif}.relation{fill:#4C1D95;font:700 16px Arial,Helvetica,sans-serif}.labelBg{fill:#FCFCFD}
  </style>
  <rect class="canvas" width="1200" height="1280"/>
  <text class="title" x="60" y="54">Schema-derived relational data model</text>
  <text class="subtitle" x="60" y="84">Client Operations Platform · verified entities, relationships, and optionality</text>

  <rect class="panel" x="40" y="120" width="1120" height="500" rx="18"/>
  <text class="section" x="70" y="160">1. Customer and booking relationships</text>

  <rect class="focus" x="90" y="320" width="230" height="80" rx="12"/>
  <text class="entityName" x="205" y="353" text-anchor="middle">Customer</text><text class="entityType" x="205" y="380" text-anchor="middle">primary record</text>
  <rect class="entity" x="420" y="205" width="230" height="80" rx="12"/>
  <text class="entityName" x="535" y="238" text-anchor="middle">Player</text><text class="entityType" x="535" y="265" text-anchor="middle">customer relationship</text>
  <rect class="entity" x="420" y="335" width="230" height="80" rx="12"/>
  <text class="entityName" x="535" y="368" text-anchor="middle">Guardian</text><text class="entityType" x="535" y="395" text-anchor="middle">participant support</text>
  <rect class="entity" x="420" y="465" width="230" height="80" rx="12"/>
  <text class="entityName" x="535" y="498" text-anchor="middle">Booking</text><text class="entityType" x="535" y="525" text-anchor="middle">customer relationship</text>
  <rect class="focus" x="880" y="335" width="250" height="90" rx="12"/>
  <text class="entityName" x="1005" y="370" text-anchor="middle">Booking Participant</text><text class="entityType" x="1005" y="398" text-anchor="middle">booking required</text>

  <path class="connector" d="M320 345 H360 V245 H420"/>
  <rect class="labelBg" x="332" y="226" width="170" height="24" rx="5"/><text class="relation" x="417" y="243" text-anchor="middle">owns · 1 → 0..*</text>
  <path class="connector" d="M320 375 H360 V505 H420"/>
  <rect class="labelBg" x="326" y="486" width="190" height="24" rx="5"/><text class="relation" x="421" y="503" text-anchor="middle">creates · 1 → 0..*</text>
  <path class="connector" d="M205 320 V185 H1005 V335"/>
  <rect class="labelBg" x="500" y="168" width="215" height="24" rx="5"/><text class="relation" x="607" y="185" text-anchor="middle">may claim · 0..1 → 0..*</text>
  <path class="connector" d="M650 245 H760 V350 H880"/>
  <rect class="labelBg" x="690" y="323" width="205" height="24" rx="5"/><text class="relation" x="792" y="340" text-anchor="middle">may fill · 0..1 → 0..*</text>
  <path class="connector" d="M650 375 H880"/>
  <rect class="labelBg" x="686" y="358" width="225" height="24" rx="5"/><text class="relation" x="798" y="375" text-anchor="middle">may support · 0..1 → 0..*</text>
  <path class="connector" d="M650 505 H760 V410 H880"/>
  <rect class="labelBg" x="684" y="438" width="205" height="24" rx="5"/><text class="relation" x="786" y="455" text-anchor="middle">contains · 1 → 0..*</text>

  <rect class="panel" x="40" y="650" width="1120" height="560" rx="18"/>
  <text class="section" x="70" y="690">2. Safety, payment, and attendance relationships</text>

  <rect class="subpanel" x="70" y="715" width="1060" height="210" rx="14"/>
  <text class="group" x="95" y="748">WAIVER</text>
  <rect class="entity" x="100" y="770" width="220" height="48" rx="9"/><text class="entityName" x="210" y="801" text-anchor="middle">Player</text>
  <rect class="entity" x="100" y="830" width="220" height="48" rx="9"/><text class="entityName" x="210" y="861" text-anchor="middle">Guardian</text>
  <rect class="entity" x="100" y="890" width="220" height="48" rx="9"/><text class="entityName" x="210" y="921" text-anchor="middle">Booking</text>
  <rect class="focus" x="900" y="805" width="190" height="85" rx="12"/><text class="entityName" x="995" y="840" text-anchor="middle">Waiver</text><text class="entityType" x="995" y="868" text-anchor="middle">player required</text>
  <path class="connector" d="M320 794 H640 V825 H900"/><text class="relation" x="665" y="812">signs · 1 → 0..*</text>
  <path class="connector" d="M320 854 H700 V847 H900"/><text class="relation" x="650" y="842">may sign for · 0..1 → 0..*</text>
  <path class="connector" d="M320 914 H760 V870 H900"/><text class="relation" x="674" y="900">may scope · 0..1 → 0..*</text>

  <rect class="subpanel" x="70" y="945" width="1060" height="120" rx="14"/>
  <text class="group" x="95" y="977">PAYMENT</text>
  <rect class="entity" x="100" y="990" width="220" height="48" rx="9"/><text class="entityName" x="210" y="1021" text-anchor="middle">Customer</text>
  <rect class="entity" x="390" y="990" width="220" height="48" rx="9"/><text class="entityName" x="500" y="1021" text-anchor="middle">Booking</text>
  <rect class="focus" x="900" y="982" width="190" height="64" rx="12"/><text class="entityName" x="995" y="1021" text-anchor="middle">Payment</text>
  <path class="connector" d="M320 1014 H900"/><rect class="labelBg" x="530" y="997" width="180" height="24" rx="5"/><text class="relation" x="620" y="1014" text-anchor="middle">makes · 1 → 0..*</text>
  <path class="connector" d="M610 1030 H760 V1038 H900"/><rect class="labelBg" x="682" y="1022" width="205" height="24" rx="5"/><text class="relation" x="784" y="1039" text-anchor="middle">may receive · 0..1 → 0..*</text>

  <rect class="subpanel" x="70" y="1085" width="1060" height="100" rx="14"/>
  <text class="group" x="95" y="1117">ATTENDANCE</text>
  <rect class="entity" x="100" y="1125" width="220" height="48" rx="9"/><text class="entityName" x="210" y="1156" text-anchor="middle">Player</text>
  <rect class="entity" x="390" y="1125" width="220" height="48" rx="9"/><text class="entityName" x="500" y="1156" text-anchor="middle">Booking</text>
  <rect class="focus" x="900" y="1117" width="190" height="64" rx="12"/><text class="entityName" x="995" y="1156" text-anchor="middle">Daily Check-in</text>
  <path class="connector" d="M320 1149 H900"/><rect class="labelBg" x="530" y="1132" width="190" height="24" rx="5"/><text class="relation" x="625" y="1149" text-anchor="middle">records · 1 → 0..*</text>
  <path class="connector" d="M610 1165 H760 V1173 H900"/><rect class="labelBg" x="690" y="1150" width="190" height="24" rx="5"/><text class="relation" x="785" y="1167" text-anchor="middle">may group · 0..1 → 0..*</text>
</svg>

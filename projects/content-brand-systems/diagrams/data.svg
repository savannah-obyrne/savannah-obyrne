<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">Content Workflow Studio relational data model</title>
  <desc id="desc">A project has zero or more research questions, research sources, revisions, approvals, history events, and export packages.</desc>
  <style>
    .bg{fill:#090711}.entity{fill:#1a1728;stroke:#8b5cf6;stroke-width:2}.hub{fill:#241b3a;stroke:#c084fc;stroke-width:3}
    .title{fill:#f8fafc;font:700 30px Arial}.subtitle{fill:#a8a0bd;font:16px Arial}.name{fill:#f8fafc;font:700 17px Arial}
    .field{fill:#cbd5e1;font:14px Arial}.rel{stroke:#9b87f5;stroke-width:2}.card{fill:#c4b5fd;font:700 13px Arial}.note{fill:#8f88a3;font:13px Arial}
  </style>
  <rect class="bg" width="1320" height="620"/>
  <text class="title" x="44" y="54">Schema-derived relational data model</text>
  <text class="subtitle" x="44" y="84">Only foreign-key relationships verified in the implemented SQLAlchemy models are shown.</text>

  <line class="rel" x1="660" y1="300" x2="250" y2="170"/><text class="card" x="420" y="220">1 → 0..*</text>
  <line class="rel" x1="660" y1="300" x2="250" y2="300"/><text class="card" x="420" y="289">1 → 0..*</text>
  <line class="rel" x1="660" y1="300" x2="250" y2="430"/><text class="card" x="420" y="380">1 → 0..*</text>
  <line class="rel" x1="660" y1="300" x2="1070" y2="170"/><text class="card" x="845" y="220">1 → 0..*</text>
  <line class="rel" x1="660" y1="300" x2="1070" y2="300"/><text class="card" x="845" y="289">1 → 0..*</text>
  <line class="rel" x1="660" y1="300" x2="1070" y2="430"/><text class="card" x="845" y="380">1 → 0..*</text>

  <rect class="hub" x="555" y="255" width="210" height="90" rx="16"/>
  <text class="name" x="660" y="293" text-anchor="middle">Project</text>
  <text class="field" x="660" y="319" text-anchor="middle">primary workflow record</text>

  <rect class="entity" x="120" y="130" width="230" height="80" rx="12"/>
  <text class="name" x="235" y="165" text-anchor="middle">Research Question</text><text class="field" x="235" y="189" text-anchor="middle">project_id required</text>
  <rect class="entity" x="120" y="260" width="230" height="80" rx="12"/>
  <text class="name" x="235" y="295" text-anchor="middle">Research Source</text><text class="field" x="235" y="319" text-anchor="middle">project_id required</text>
  <rect class="entity" x="120" y="390" width="230" height="80" rx="12"/>
  <text class="name" x="235" y="425" text-anchor="middle">Revision</text><text class="field" x="235" y="449" text-anchor="middle">project + kind + number unique</text>

  <rect class="entity" x="970" y="130" width="230" height="80" rx="12"/>
  <text class="name" x="1085" y="165" text-anchor="middle">Approval</text><text class="field" x="1085" y="189" text-anchor="middle">project_id required</text>
  <rect class="entity" x="970" y="260" width="230" height="80" rx="12"/>
  <text class="name" x="1085" y="295" text-anchor="middle">History Event</text><text class="field" x="1085" y="319" text-anchor="middle">project_id required</text>
  <rect class="entity" x="970" y="390" width="230" height="80" rx="12"/>
  <text class="name" x="1085" y="425" text-anchor="middle">Export Package</text><text class="field" x="1085" y="449" text-anchor="middle">project_id required</text>

  <text class="note" x="44" y="565">Approval records carry a revision identifier in application logic, but no direct database foreign key is claimed in this diagram.</text>
</svg>

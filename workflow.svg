<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Content and Brand Systems workflow</title>
  <desc id="desc">A six-stage sequence from project foundation through research evidence, direction approval, lesson and script work, human approval, and export package.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6D28D9"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#FCFCFD}
    .stage{fill:#FFFFFF;stroke:#D8D5E0;stroke-width:2}
    .number{fill:#6D28D9}
    .connector{fill:none;stroke:#6D28D9;stroke-width:3}
    .title{fill:#262330;font:700 30px Arial,Helvetica,sans-serif}
    .subtitle{fill:#625D6B;font:400 18px Arial,Helvetica,sans-serif}
    .numberText{fill:#FFFFFF;font:700 20px Arial,Helvetica,sans-serif}
    .stageName{fill:#262330;font:700 22px Arial,Helvetica,sans-serif}
    .stageDetail{fill:#625D6B;font:400 18px Arial,Helvetica,sans-serif}
  </style>
  <rect class="canvas" width="1200" height="550"/>
  <text class="title" x="60" y="54">Project-to-export workflow</text>
  <text class="subtitle" x="60" y="84">Six verified stages · numbered in reading order</text>

  <rect class="stage" x="70" y="120" width="330" height="150" rx="14"/>
  <circle class="number" cx="112" cy="166" r="24"/>
  <text class="numberText" x="112" y="173" text-anchor="middle">1</text>
  <text class="stageName" x="150" y="166">Foundation</text>
  <text class="stageDetail" x="150" y="207">Project foundation</text>

  <path class="connector" d="M400 195 H423" marker-end="url(#arrow)"/>
  <rect class="stage" x="435" y="120" width="330" height="150" rx="14"/>
  <circle class="number" cx="477" cy="166" r="24"/>
  <text class="numberText" x="477" y="173" text-anchor="middle">2</text>
  <text class="stageName" x="515" y="166">Evidence</text>
  <text class="stageDetail" x="515" y="207">Research evidence</text>

  <path class="connector" d="M765 195 H788" marker-end="url(#arrow)"/>
  <rect class="stage" x="800" y="120" width="330" height="150" rx="14"/>
  <circle class="number" cx="842" cy="166" r="24"/>
  <text class="numberText" x="842" y="173" text-anchor="middle">3</text>
  <text class="stageName" x="880" y="166">Direction</text>
  <text class="stageDetail" x="880" y="207">Direction approval</text>

  <path class="connector" d="M965 270 V343" marker-end="url(#arrow)"/>
  <rect class="stage" x="800" y="355" width="330" height="150" rx="14"/>
  <circle class="number" cx="842" cy="401" r="24"/>
  <text class="numberText" x="842" y="408" text-anchor="middle">4</text>
  <text class="stageName" x="880" y="401">Artifacts</text>
  <text class="stageDetail" x="880" y="442">Lesson and script</text>

  <path class="connector" d="M800 430 H777" marker-end="url(#arrow)"/>
  <rect class="stage" x="435" y="355" width="330" height="150" rx="14"/>
  <circle class="number" cx="477" cy="401" r="24"/>
  <text class="numberText" x="477" y="408" text-anchor="middle">5</text>
  <text class="stageName" x="515" y="401">Approval</text>
  <text class="stageDetail" x="515" y="442">Human approval</text>

  <path class="connector" d="M435 430 H412" marker-end="url(#arrow)"/>
  <rect class="stage" x="70" y="355" width="330" height="150" rx="14"/>
  <circle class="number" cx="112" cy="401" r="24"/>
  <text class="numberText" x="112" y="408" text-anchor="middle">6</text>
  <text class="stageName" x="150" y="401">Delivery</text>
  <text class="stageDetail" x="150" y="442">Export package</text>
</svg>
